name: AnyRouter 自动签到
on:
  schedule:
    - cron: '49 */6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试模式（截图 artifact、详细日志）
        required: false
        default: false
        type: boolean
      force_notify:
        description: 强制发送签到通知（即使余额无变化）
        required: false
        default: false
        type: boolean
      skip_notify:
        description: 静默测试（执行真实签到，但不发送通知）
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: '1'
      # Keep Chromium Unix socket paths below Linux's 108-byte limit in this long repository path.
      TMPDIR: ${{ github.workspace }}/.t
      GNUPGHOME: ${{ github.workspace }}/.cache/warp/gnupg
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      CLOAKBROWSER_CACHE_DIR: ${{ github.workspace }}/.cache/cloakbrowser
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache/xdg-cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/.cache/xdg-config
      XDG_DATA_HOME: ${{ github.workspace }}/.cache/xdg-data
      CHECKIN_PROXY_URL: socks5://127.0.0.1:40000
      CHECKIN_PROXY_REQUIRED: 'true'
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}
      CHECKIN_FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_notify == 'true' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Prepare project output directories
      run: mkdir -p "$TMPDIR" "$GNUPGHOME"

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: '0.13.7'
        enable-cache: false
        cache-local-path: ${{ github.workspace }}/.cache/uv

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v5
      id: uv-cache
      with:
        path: .cache/uv
        key: ${{ runner.os }}-uv-warp-v1-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-warp-v1-

    - name: 安装依赖
      run: |
        uv sync --frozen --no-dev
        echo "✅ 环境初始化完成"

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
          fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

    - name: 缓存 CloakBrowser 二进制
      uses: actions/cache@v5
      id: cloakbrowser-cache
      with:
        path: .cache/cloakbrowser
        key: ${{ runner.os }}-cloakbrowser-warp-v1-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-cloakbrowser-warp-v1-

    - name: 安装 CloakBrowser
      run: |
        uv run --frozen --no-dev python -m cloakbrowser install
        echo "✅ CloakBrowser 安装完成"

    - name: 恢复余额历史缓存
      uses: actions/cache@v5
      with:
        path: balance_hash.txt
        key: balance-hash-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          balance-hash-${{ github.ref_name }}-
          balance-hash-

    - name: 恢复浏览器 Profile 缓存
      uses: actions/cache@v5
      with:
        path: .browser_profiles
        key: browser-profiles-${{ runner.os }}-v1
        restore-keys: |
          browser-profiles-${{ runner.os }}-

    - name: Start WARP and verify AgentRouter access
      env:
        PROVIDERS: ${{ secrets.PROVIDERS }}
      run: bash scripts/setup_warp_proxy.sh

    - name: 执行签到
      env:
        DEBUG_MODE: ${{ env.DEBUG_MODE }}
        CHECKIN_FORCE_NOTIFY: ${{ env.CHECKIN_FORCE_NOTIFY }}
        CHECKIN_SKIP_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_notify == 'true' && 'true' || 'false' }}
        CHECKIN_HEADLESS: false
        CHECKIN_HUMANIZE: true
        CHECKIN_WAIT_TIMEOUT_MS: 120000
        CLOAKBROWSER_BINARY_PATH: ${{ github.workspace }}/.cache/cloakbrowser/chromium-146.0.7680.177.5/chrome
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
      run: |
        if [ "$CHECKIN_SKIP_NOTIFY" = 'true' ]; then
          unset DINGDING_WEBHOOK EMAIL_USER EMAIL_PASS EMAIL_TO EMAIL_SENDER CUSTOM_SMTP_SERVER \
            PUSHPLUS_TOKEN SERVERPUSHKEY FEISHU_WEBHOOK WEIXIN_WEBHOOK TELEGRAM_BOT_TOKEN \
            TELEGRAM_CHAT_ID GOTIFY_URL GOTIFY_TOKEN GOTIFY_PRIORITY BARK_KEY BARK_SERVER
          echo '[NOTIFY] External notifications disabled for this manual test'
        fi
        xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run --frozen --no-dev python -B checkin.py

    - name: 上传调试截图
      if: always() && env.DEBUG_MODE == 'true'
      env:
        HTTP_PROXY: ''
        HTTPS_PROXY: ''
      uses: actions/upload-artifact@v4
      with:
        name: checkin-screenshots-${{ github.run_id }}
        path: checkin_screenshots/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

    - name: Remove temporary WARP registration
      if: always()
      run: bash scripts/stop_warp_proxy.sh

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(date)"
        if [ "${DEBUG_MODE}" = "true" ] && [ -d checkin_screenshots ] && [ "$(ls -A checkin_screenshots 2>/dev/null)" ]; then
          echo "调试截图已上传为 artifact: checkin-screenshots-${{ github.run_id }}"
          ls -la checkin_screenshots/
        fi
